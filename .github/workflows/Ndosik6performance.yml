name: K6 Performance Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM UTC

jobs:
  performance-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }} # optional (use if your tests support env vars)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install k6 (simplified)
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C780D0BDB1A69C86
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Create results directory
        run: mkdir -p ./k6-results

      # 🔥 Login Test (FAILS pipeline if thresholds fail)
      - name: Run Login Performance Test
        run: |
          k6 run tests/loginTest.js \
            --out json=./k6-results/login-results.json

      # 🔥 Profile Test
      - name: Run Profile Performance Test
        run: |
          k6 run tests/profileTest.js \
            --out json=./k6-results/profile-results.json

      # Generate HTML reports (does NOT fail pipeline)
      - name: Generate HTML Reports
        if: always()
        run: |
          npm install -g k6-reporter || true

          if [ -f ./k6-results/login-results.json ]; then
            k6-reporter \
              --out ./k6-results/login-report.html \
              ./k6-results/login-results.json
          fi

          if [ -f ./k6-results/profile-results.json ]; then
            k6-reporter \
              --out ./k6-results/profile-report.html \
              ./k6-results/profile-results.json
          fi

      # Upload artifacts
      - name: Upload K6 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_number }}
          path: ./k6-results/
          retention-days: 14

      # Summary in GitHub UI
      - name: Generate Summary
        if: always()
        run: |
          echo "## 🚀 K6 Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📂 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- login-results.json" >> $GITHUB_STEP_SUMMARY
          echo "- login-report.html" >> $GITHUB_STEP_SUMMARY
          echo "- profile-results.json" >> $GITHUB_STEP_SUMMARY
          echo "- profile-report.html" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts from this run for full details." >> $GITHUB_STEP_SUMMARY