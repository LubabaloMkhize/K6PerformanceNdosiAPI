on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC

jobs:
  performance-tests:
    runs-on: ubuntu-latest

    

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create results directory
        run: mkdir -p ./k6-results

      #  Login test (JSON + Web Dashboard in ONE run)
      - name: Run Login Performance Test
        uses: grafana/k6-action@v0.3.1
        env:
          K6_WEB_DASHBOARD_EXPORT: ./k6-results/login-dashboard/index.html
        with:
          filename: tests/loginTest.js
          flags: >
            --out json=./k6-results/login-results.json
            --out web-dashboard=./k6-results/login-dashboard


      #  Profile test (JSON + Web Dashboard in ONE run)
      - name: Run Profile Performance Test
        uses: grafana/k6-action@v0.3.1
        env:
          K6_WEB_DASHBOARD_EXPORT: ./k6-results/profile-dashboard/index.html
        with:
          filename: tests/profileTest.js
          flags: >
            --out json=./k6-results/profile-results.json
            --out web-dashboard=./k6-results/profile-dashboard

      # Create Testimonial test (JSON + Web Dashboard)
      - name: Run Create Testimonial Performance Test
        uses: grafana/k6-action@v0.3.1
        env:
          K6_WEB_DASHBOARD_EXPORT: ./k6-results/create-testimonial-dashboard/index.html
        with:
          filename: tests/createTestimonialTest.js
          flags: >
            --out json=./k6-results/create-testimonial-results.json
            --out web-dashboard=./k6-results/create-testimonial-dashboard

      # Update Testimonial test
      - name: Run Update Testimonial Performance Test
        uses: grafana/k6-action@v0.3.1
        env:
          K6_WEB_DASHBOARD_EXPORT: ./k6-results/update-testimonial-dashboard/index.html
        with:
          filename: tests/updateTestimonialTest.js
          flags: >
            --out json=./k6-results/update-testimonial-results.json
            --out web-dashboard=./k6-results/update-testimonial-dashboard

      # Delete Testimonial test
      - name: Run Delete Testimonial Performance Test
        uses: grafana/k6-action@v0.3.1
        env:
          K6_WEB_DASHBOARD_EXPORT: ./k6-results/delete-testimonial-dashboard/index.html
        with:
          filename: tests/deleteTestimonialTest.js
          flags: >
            --out json=./k6-results/delete-testimonial-results.json
            --out web-dashboard=./k6-results/delete-testimonial-dashboard

      # Generate HTML Report Index
      - name: Generate HTML Report
        if: always()
        run: |
          cat > ./k6-results/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>K6 Performance Test Results - Run #${{ github.run_number }}</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                      max-width: 1200px;
                      margin: 0 auto;
                      padding: 20px;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: #333;
                  }
                  .container {
                      background: white;
                      border-radius: 8px;
                      padding: 30px;
                      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                  }
                  h1 {
                      color: #667eea;
                      margin-bottom: 10px;
                  }
                  .meta {
                      color: #666;
                      margin-bottom: 30px;
                      font-size: 14px;
                  }
                  .test-grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                      gap: 20px;
                  }
                  .test-card {
                      border: 2px solid #667eea;
                      border-radius: 6px;
                      padding: 20px;
                      transition: all 0.3s ease;
                  }
                  .test-card:hover {
                      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
                      transform: translateY(-2px);
                  }
                  .test-card h2 {
                      color: #667eea;
                      margin: 0 0 15px 0;
                      font-size: 18px;
                  }
                  .button-group {
                      display: flex;
                      gap: 10px;
                      flex-wrap: wrap;
                  }
                  a.button {
                      display: inline-block;
                      padding: 10px 20px;
                      background: #667eea;
                      color: white;
                      text-decoration: none;
                      border-radius: 4px;
                      font-size: 14px;
                      transition: background 0.3s;
                  }
                  a.button:hover {
                      background: #764ba2;
                  }
                  a.button.json {
                      background: #48bb78;
                  }
                  a.button.json:hover {
                      background: #38a169;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🚀 K6 Performance Test Results</h1>
                  <div class="meta">
                      <p><strong>Run Number:</strong> ${{ github.run_number }}</p>
                      <p><strong>Date:</strong> $(date '+%Y-%m-%d %H:%M:%S')</p>
                      <p><strong>Commit:</strong> ${{ github.sha }}</p>
                  </div>

                  <div class="test-grid">
                      <div class="test-card">
                          <h2>🔐 Login Test</h2>
                          <div class="button-group">
                              <a href="login-dashboard/index.html" class="button">View Dashboard</a>
                              <a href="login-results.json" class="button json">View JSON</a>
                          </div>
                      </div>

                      <div class="test-card">
                          <h2>👤 Profile Test</h2>
                          <div class="button-group">
                              <a href="profile-dashboard/index.html" class="button">View Dashboard</a>
                              <a href="profile-results.json" class="button json">View JSON</a>
                          </div>
                      </div>

                      <div class="test-card">
                          <h2>✏️ Create Testimonial</h2>
                          <div class="button-group">
                              <a href="create-testimonial-dashboard/index.html" class="button">View Dashboard</a>
                              <a href="create-testimonial-results.json" class="button json">View JSON</a>
                          </div>
                      </div>

                      <div class="test-card">
                          <h2>📝 Update Testimonial</h2>
                          <div class="button-group">
                              <a href="update-testimonial-dashboard/index.html" class="button">View Dashboard</a>
                              <a href="update-testimonial-results.json" class="button json">View JSON</a>
                          </div>
                      </div>

                      <div class="test-card">
                          <h2>🗑️ Delete Testimonial</h2>
                          <div class="button-group">
                              <a href="delete-testimonial-dashboard/index.html" class="button">View Dashboard</a>
                              <a href="delete-testimonial-results.json" class="button json">View JSON</a>
                          </div>
                      </div>
                  </div>
              </div>
          </body>
          </html>
          EOF

      #  Upload all results
      - name: Upload K6 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_number }}
          path: ./k6-results/
          retention-days: 14

      - name: List k6-results contents
        if: always()
        run: ls -R ./k6-results


      #  GitHub Actions summary
      - name: Generate Summary
        if: always()
        run: |
          echo "## 🚀 K6 Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📊 Interactive Reports" >> $GITHUB_STEP_SUMMARY
          echo "- login-dashboard/index.html" >> $GITHUB_STEP_SUMMARY
          echo "- profile-dashboard/index.html" >> $GITHUB_STEP_SUMMARY
          echo "- create-testimonial-dashboard/index.html" >> $GITHUB_STEP_SUMMARY
          echo "- create-testimonial-results.json" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📂 Raw Data" >> $GITHUB_STEP_SUMMARY
          echo "- login-results.json" >> $GITHUB_STEP_SUMMARY
          echo "- profile-results.json" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⬇️ Download the artifact and open index.html locally to view reports." >> $GITHUB_STEP_SUMMARY