name: K6 Performance Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC

jobs:
  performance-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create results directory
        run: mkdir -p ./k6-results

      # 🔥 Run Login Performance Test (JSON output)
      - name: Run Login Performance Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/loginTest.js
          flags: --out json=./k6-results/login-results.json

      # 🔥 Run Profile Performance Test (JSON output)
      - name: Run Profile Performance Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/profileTest.js
          flags: --out json=./k6-results/profile-results.json

      # 📊 Generate Login Web Dashboard Report
      - name: Generate Login Web Dashboard
        if: always()
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/loginTest.js
          flags: --out web-dashboard=./k6-results/login-dashboard

      # 📊 Generate Profile Web Dashboard Report
      - name: Generate Profile Web Dashboard
        if: always()
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/profileTest.js
          flags: --out web-dashboard=./k6-results/profile-dashboard

      # 📦 Upload artifacts (JSON + dashboards)
      - name: Upload K6 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_number }}
          path: ./k6-results/
          retention-days: 14

      # 🧾 GitHub Summary
      - name: Generate Summary
        if: always()
        run: |
          echo "## 🚀 K6 Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📊 Reports (Download Artifacts to View)" >> $GITHUB_STEP_SUMMARY
          echo "- login-dashboard/index.html" >> $GITHUB_STEP_SUMMARY
          echo "- profile-dashboard/index.html" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📂 Raw Results" >> $GITHUB_STEP_SUMMARY
          echo "- login-results.json" >> $GITHUB_STEP_SUMMARY
          echo "- profile-results.json" >> $GITHUB_STEP_SUMMARY