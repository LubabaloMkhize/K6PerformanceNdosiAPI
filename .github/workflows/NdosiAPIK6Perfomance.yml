name: K6 Performance Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  performance-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create results directory
        run: mkdir -p ./k6-results

      # 🔥 Run Login Test
      - name: Run Login Performance Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/loginTest.js
          flags: --out json=./k6-results/login-results.json

      # 🔥 Run Profile Test
      - name: Run Profile Performance Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/profileTest.js
          flags: --out json=./k6-results/profile-results.json

      # 📊 Generate HTML reports
      - name: Generate Login HTML Report
        if: always()
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/loginTest.js
          flags: --out html=./k6-results/login-report.html

      - name: Generate Profile HTML Report
        if: always()
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/profileTest.js
          flags: --out html=./k6-results/profile-report.html

      # 📦 Upload artifacts
      - name: Upload K6 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_number }}
          path: ./k6-results/
          retention-days: 14